<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MemoryOS settings</title>
    <style>
      body { font: 14px system-ui, sans-serif; padding: 20px; max-width: 380px; }
      label { display: block; margin-top: 12px; font-weight: 600; }
      input, textarea { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; font: inherit; }
      textarea { resize: vertical; min-height: 60px; }
      button { margin-top: 16px; padding: 8px 14px; }
      #status { margin-top: 10px; }
      hr { margin: 20px 0; }
      p.hint { color: #666; font-size: 12px; margin: 4px 0 0; }
    </style>
  </head>
  <body>
    <h2>MemoryOS</h2>

    <label>API base URL (from the SAM stack outputs)
      <input id="apiBaseUrl" placeholder="https://xxxx.execute-api.region.amazonaws.com" />
    </label>
    <label>AWS region
      <input id="awsRegion" placeholder="ap-south-1" />
    </label>
    <label>Cognito app client id (stack output UserPoolClientId)
      <input id="clientId" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxx" />
    </label>
    <button id="saveConfig">Save config</button>

    <hr />

    <label>Connection code
      <textarea id="code" placeholder="Paste the code from your MemoryOS dashboard → Settings"></textarea>
      <p class="hint">Log in on the web dashboard, open Settings, and copy the code shown there.</p>
    </label>
    <button id="connect">Connect</button>

    <div id="status"></div>
    <script src="options.js"></script>
  </body>
</html>
